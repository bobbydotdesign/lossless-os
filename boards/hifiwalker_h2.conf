# Lossless OS on the HiFi Walker H2 (with prj.conf).
# SPDX-License-Identifier: Apache-2.0

# Messages go to the screen log (platform/h2/screen.c) through printk
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_BOOT_BANNER=n
CONFIG_MAIN_STACK_SIZE=32768

# The SD card: our MSC driver, Zephyr's SD stack, FatFs
CONFIG_SDMMC_STACK=y
CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVER_SDMMC=y
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
# Files saved get the player's date and time (get_fattime, platform/zephyr/sys.c)
CONFIG_FS_FATFS_HAS_RTC=y
# The library walks folders six deep, each level open on the way down
CONFIG_FS_FATFS_NUM_DIRS=10
CONFIG_FS_FATFS_EXFAT=y
CONFIG_FS_FATFS_LFN=y
CONFIG_FS_FATFS_MAX_LFN=255

# Read and write (test 4c): written only in /.lossless, never formatted
CONFIG_FS_FATFS_READ_ONLY=n
CONFIG_FS_FATFS_MOUNT_MKFS=n

# LVGL reads files through our "A:" drive (platform/zephyr/lv_drive_a.c)
CONFIG_LV_Z_USE_FILESYSTEM=n
CONFIG_CRC=y

# Memory: the H2 gives us 16 MB. LVGL gets 10 MB, with room to keep decoded
# covers (3 MB cache) and drawn glyphs (the X1000 has no FPU, so drawing a
# glyph from the TTF is slow; keep plenty)
CONFIG_LV_Z_MEM_POOL_SIZE=10485760
CONFIG_LV_CACHE_DEF_SIZE=3145728
CONFIG_LV_IMAGE_HEADER_CACHE_DEF_CNT=32
CONFIG_LV_TINY_TTF_CACHE_GLYPH_CNT=512

# The audio thread reads the card while the UI does: FatFs must be
# thread-safe, which needs long names on each thread's stack
CONFIG_FS_FATFS_LFN_MODE_STACK=y
CONFIG_FS_FATFS_REENTRANT=y

# A write that goes wrong gives up in seconds, not minutes (the start-up
# write check would otherwise sit on the logo)
CONFIG_SD_DATA_TIMEOUT=2000
CONFIG_SD_DATA_RETRIES=1
