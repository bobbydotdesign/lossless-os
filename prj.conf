# Lossless OS: Zephyr settings shared by every board.
# SPDX-License-Identifier: Apache-2.0
CONFIG_MAIN_STACK_SIZE=16384
CONFIG_LOG=y
CONFIG_DISPLAY=y

# LVGL: the same look as the simulator (platform/host/lv_conf.h)
CONFIG_LVGL=y
CONFIG_LV_Z_MEM_POOL_SIZE=4194304
CONFIG_LV_COLOR_DEPTH_16=y
CONFIG_LV_USE_LOG=y
CONFIG_LV_USE_LABEL=y
CONFIG_LV_USE_IMAGE=y
CONFIG_LV_USE_FLEX=y
CONFIG_LV_FONT_MONTSERRAT_14=y
CONFIG_LV_USE_TINY_TTF=y
CONFIG_LV_TINY_TTF_FILE_SUPPORT=y
CONFIG_LV_USE_TJPGD=y

# C++ for Android's MP3 decoder (lib/pvmp3): plain code, no C++ library
CONFIG_CPP=y

# The audio thread (priority 2) runs above the UI
CONFIG_MAIN_THREAD_PRIORITY=5
